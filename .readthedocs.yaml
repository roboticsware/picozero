version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"
  jobs:
    pre_build:
      - |
        if [ "$MY_DOC_LANG" = "ko" ]; then
          cp -r docs/ko/* docs/
        elif [ "$MY_DOC_LANG" = "uz" ]; then
          cp -r docs/uz/* docs/
        fi

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py