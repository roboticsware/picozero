[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "picozero-rw"
version = "0.4.5"
authors = [
  { name="Roboticsware", email="roboticsware.uz@gmail.com" },
]
description = "A simple library for controlling components with Raspberry Pi Pico."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools]
# 'picozero' 폴더를 패키지로 자동 포함합니다.
packages = ["picozero"]
